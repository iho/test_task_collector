version: "2"
sql:
  - schema: "sql/schema.sql"
    queries: "sql/query.sql"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "nullable_float8"
            go_type: "github.com/jackc/pgx/v5/pgtype.Float8"
